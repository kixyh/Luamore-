<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jobless Hub | Get Key</title>
<style>
  :root{--bg:#191919;--top:#222;--elem:#232323;--hover:#2c2c2c;--stroke:#323232;--text:#f0f0f0;--sub:#a5a5a5;--dim:#6e6e6e;--acc:#0092d6;--good:#46d27d;--bad:#f05555;--warn:#f0af41}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f0f10;color:var(--text);font:14px/1.4 Gotham,"Segoe UI",system-ui,sans-serif;padding:16px}
  .win{width:100%;max-width:440px;background:var(--bg);border:1px solid var(--stroke);border-radius:8px;overflow:hidden;box-shadow:0 18px 50px #000a;animation:pop .5s cubic-bezier(.2,1.2,.3,1)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95)}}
  .top{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;background:var(--top);border-bottom:1px solid var(--stroke);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .chip{background:var(--elem);color:var(--sub);font-size:10px;padding:3px 7px;border-radius:5px}
  main{padding:20px 24px 24px}
  h1{margin:0 0 4px;font-size:20px}
  .sub{margin:0 0 16px;color:var(--sub);font-size:12px}
  .steps{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
  .steps li{display:flex;gap:10px;align-items:center;background:var(--elem);border-radius:6px;padding:10px 12px;color:var(--sub);font-size:12px;transition:.3s}
  .steps li b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--stroke);color:var(--text);font-size:11px;transition:.3s}
  .steps li.on{color:var(--text)} .steps li.on b{background:var(--acc)}
  .steps li.done b{background:var(--good)}
  button{font:inherit;font-weight:600;border:0;border-radius:6px;cursor:pointer;color:#fff;transition:.15s}
  #go{width:100%;height:40px;background:var(--acc);font-size:14px}
  #go:hover:not(:disabled){filter:brightness(1.15)} #go:active:not(:disabled){transform:scale(.97)} #go:disabled{opacity:.5;cursor:default}
  .keybox{display:flex;gap:8px;align-items:center;background:var(--elem);border:1.5px solid var(--good);border-radius:6px;padding:8px 8px 8px 14px;animation:pop .4s}
  .keybox code{flex:1;font:600 15px ui-monospace,Consolas,monospace;word-break:break-all}
  #copy{background:var(--top);height:30px;padding:0 14px;font-size:12px} #copy:hover{background:var(--hover)}
  #exp{margin:8px 0 0;color:var(--dim);font-size:11px}
  #msg{min-height:18px;margin:12px 0 0;font-size:12px;color:var(--sub)}
  #msg.ok{color:var(--good)} #msg.err{color:var(--bad)} #msg.warn{color:var(--warn)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="win">
  <div class="top"><span class="dot"></span>Jobless Hub<span class="chip">Key System</span></div>
  <main>
    <h1>Get your key</h1>
    <p class="sub">Complete the steps below to generate a key, then paste it into the loader.</p>
    <ol class="steps" id="steps">
      <li id="s1" class="on"><b>1</b>Press Start and finish the checkpoint</li>
      <li id="s2"><b>2</b>Wait for verification</li>
      <li id="s3"><b>3</b>Copy your key into the script</li>
    </ol>
    <button id="go">Start</button>
    <div id="out" hidden>
      <div class="keybox"><code id="key"></code><button id="copy">Copy</button></div>
      <p id="exp"></p>
    </div>
    <p id="msg"></p>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const msg = (t, c) => { $('msg').textContent = t; $('msg').className = c || ''; };
const step = (n) => ['s1','s2','s3'].forEach((id, i) => $(id).className = i + 1 < n ? 'done' : i + 1 === n ? 'on' : '');
const ERR = {
  rate_limited: 'Too many requests. Try again later.',
  invalid_session: 'Session expired. Press Start again.',
};

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  return { status: r.status, data: await r.json().catch(() => ({})) };
}

function showKey(key, expires) {
  step(4); $('steps').querySelectorAll('li').forEach((li) => li.className = 'done');
  $('go').hidden = true; $('out').hidden = false; $('key').textContent = key;
  $('exp').textContent = expires ? 'Expires ' + new Date(expires).toLocaleString() : 'This key does not expire.';
  localStorage.setItem('saved', JSON.stringify({ key, expires }));
}

function countdown(n, done) {
  msg(`Please wait ${n}s...`, 'warn');
  const t = setInterval(() => {
    n--; msg(`Please wait ${n}s...`, 'warn');
    if (n <= 0) { clearInterval(t); done(); }
  }, 1000);
}

async function claim(session) {
  step(2); msg('Verifying...');
  const { status, data } = await api('/api/claim', { session });
  if (status === 200) { localStorage.removeItem('session'); showKey(data.key, data.expires); msg('Key generated!', 'ok'); return; }
  if (data.error === 'too_fast') return countdown(data.wait, () => claim(session));
  localStorage.removeItem('session');
  step(1); $('go').disabled = false;
  msg(ERR[data.error] || 'Something went wrong. Press Start again.', 'err');
}

$('go').onclick = async () => {
  $('go').disabled = true; msg('Starting...');
  const { status, data } = await api('/api/start');
  if (status !== 200) { $('go').disabled = false; return msg(ERR[data.error] || 'Could not start.', 'err'); }
  localStorage.setItem('session', data.session);
  if (data.checkpointUrl) { msg('Redirecting to checkpoint...'); location.href = data.checkpointUrl; }
  else countdown(data.minSeconds, () => claim(data.session));
};

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('key').textContent); $('copy').textContent = 'Copied!'; }
  catch { msg('Select the key and copy it manually.', 'warn'); }
  setTimeout(() => $('copy').textContent = 'Copy', 1500);
};

// on load: show a still-valid saved key, or finish a checkpoint redirect
(() => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('saved')); } catch {}
  if (saved && (!saved.expires || saved.expires > Date.now())) return showKey(saved.key, saved.expires);
  const session = localStorage.getItem('session');
  if (session && new URLSearchParams(location.search).get('step') === '2') { $('go').disabled = true; claim(session); }
})();
</script>
</body>
</html>
